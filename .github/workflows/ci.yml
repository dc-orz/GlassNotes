name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Check and package on macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check design rules, formatting, and tests
        run: make check
      - name: Build the app and verify the disk image
        run: make dmg
      - name: Check the package version and record its SHA-256
        working-directory: dist
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw GlassNotes.app/Contents/Info.plist)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the packaged version $version"
            exit 1
          fi
          dmg="GlassNotes-$version-arm64.dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - name: Save the verified disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlassNotes-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish the verified DMG
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GlassNotes-arm64
          path: dist
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh
